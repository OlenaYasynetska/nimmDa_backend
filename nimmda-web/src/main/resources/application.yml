spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DB:nimmda}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://127.0.0.1:27017/nimmda}
      database: ${MONGO_DB:nimmda}
      auto-index-creation: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: "${MAIL_PORT:587}"
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.nimmda: DEBUG

app:
  api:
    public-base-url: ${API_PUBLIC_BASE_URL:https://api.nimmda.org}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://www.nimmda.org,https://nimmda.org,https://localhost,http://localhost,capacitor://localhost}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: "${MAIL_FROM:NimmDa <noreply@nimmda.org>}"
    resend:
      api-key: ${RESEND_API_KEY:}
  invoice:
    seller-name: ${INVOICE_SELLER_NAME:Olena Yasynetska}
    seller-address: ${INVOICE_SELLER_ADDRESS:Arbeiterstraße 26/3, 4400 Steyr, Österreich}
    seller-email: ${INVOICE_SELLER_EMAIL:contact@ugs-info.at}
    copy-to: ${INVOICE_COPY_TO:olenayasynetska8@gmail.com}
  jwt:
    secret: ${JWT_SECRET:nimmda-dev-jwt-secret-change-me-please-32}
    ttl-ms: ${JWT_TTL_MS:86400000}
  auth:
    expose-dev-links: ${AUTH_EXPOSE_DEV_LINKS:false}
    super-admin-email: ${SUPER_ADMIN_EMAIL:}
    super-admin-password: ${SUPER_ADMIN_PASSWORD:}
  promotion:
    price-cents: ${PROMOTION_PRICE_CENTS:499}
    days: ${PROMOTION_DAYS:7}
  business:
    price-cents: ${BUSINESS_PRICE_CENTS:1999}
    days: ${BUSINESS_DAYS:30}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  geocoder:
    enabled: ${GEOCODER_ENABLED:true}
    url: ${GEOCODER_URL:https://nominatim.openstreetmap.org/search}
    user-agent: ${GEOCODER_USER_AGENT:NimmDa/1.0 (https://nimmda.org)}
