spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DB:nimmda}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://127.0.0.1:27017/nimmda}
      database: ${MONGO_DB:nimmda}
      auto-index-creation: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.nimmda: DEBUG

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://www.nimmda.org,https://nimmda.org}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:NimmDa <noreply@nimmda.org>}
    resend:
      api-key: ${RESEND_API_KEY:}
  jwt:
    secret: ${JWT_SECRET:nimmda-dev-jwt-secret-change-me-please-32}
    ttl-ms: ${JWT_TTL_MS:86400000}
  auth:
    expose-dev-links: ${AUTH_EXPOSE_DEV_LINKS:false}
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
